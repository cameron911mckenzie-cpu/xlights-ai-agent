[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xlights-ai-agent"
version = "0.1.0"
description = "AI auto-sequencer addon for xLights: sequence songs from their music beats, with prompt-driven style suggestions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "xlights-ai-agent contributors" }]
keywords = ["xlights", "lights", "sequencer", "beat-detection", "ai", "holiday-lights"]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
xlights-ai = "xlights_ai_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
